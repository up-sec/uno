title = "Uno gitleaks config"

# Reglas por defecto de gitleaks + reglas propias del proyecto.
[extend]
useDefault = true

# Seed secreta de Stellar (StrKey ed25519 privada): "S" + 55 caracteres base32.
# Equivale a ^S[A-Z2-7]{55}$ aplicado a una palabra completa; se usa \b porque
# gitleaks escanea fragmentos de varias líneas, no valores aislados.
[[rules]]
id = "stellar-secret-seed"
description = "Stellar secret seed (S...)"
regex = '''\bS[A-Z2-7]{55}\b'''
tags = ["stellar", "secret-key"]

# Falso positivo: NEXT_PUBLIC_MXNDEMO_TOKEN_ID es el Contract ID (C...) del token
# MXNDEMO, público por diseño (va al navegador), no una llave. Solo se excluye
# esa variable en ese archivo, para generic-api-key, y solo si su valor tiene
# forma de Contract ID; una seed S... ahí seguiría detectándose.
[[allowlists]]
description = "Contract ID público de MXNDEMO en frontend/.env.example"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^frontend/\.env\.example$''']
regexTarget = "line"
regexes = ['''\bNEXT_PUBLIC_MXNDEMO_TOKEN_ID=C[A-Z2-7]{55}\b''']
